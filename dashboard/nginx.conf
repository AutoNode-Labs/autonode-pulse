server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression — reduces payload size for JS/CSS bundles significantly
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # Vite-built assets include content hashes in filenames — safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy /api/* to the backend API service.
    # In Docker Compose the service is reachable at http://api:3000.
    # This mirrors Vite's dev proxy, so frontend code requires zero changes
    # between local dev, Docker staging, and Vercel+Render production.
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Forward /health to the backend for orchestration health checks
    location /health {
        proxy_pass http://api:3000;
    }

    # SPA fallback — React Router handles client-side routing.
    # Any path that doesn't match a static file serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
