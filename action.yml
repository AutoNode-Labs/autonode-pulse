name: 'AutoNode Pulse'
description: 'Architectural Auditing & LLM-Readiness score — CI/CD quality gate for web pages'
author: 'AutoNode-Labs'

branding:
  icon: 'activity'
  color: 'blue'

inputs:
  url:
    description: 'Target URL to audit (must be https://)'
    required: true
  threshold:
    description: 'Minimum acceptable Pulse Score (0–100). Pipeline fails if score is below.'
    required: false
    default: '70'

outputs:
  score:
    description: 'Overall Pulse Score (0–100)'
    value: ${{ steps.audit.outputs.score }}
  grade:
    description: 'Letter grade (A+, A, B+, B, C, D, F)'
    value: ${{ steps.audit.outputs.grade }}
  passed:
    description: '"true" if score ≥ threshold, "false" otherwise'
    value: ${{ steps.audit.outputs.passed }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      shell: bash
      run: npm ci --prefix "${{ github.action_path }}" --omit=dev

    - name: Run audit
      id: audit
      shell: bash
      env:
        TARGET_URL: ${{ inputs.url }}
        THRESHOLD:  ${{ inputs.threshold }}
      run: |
        CLI="${{ github.action_path }}/bin/index.js"
        JSON_FILE=$(mktemp)

        # Single fetch: human-readable report to stdout + JSON to temp file
        node "$CLI" "$TARGET_URL" --threshold "$THRESHOLD" --json-out "$JSON_FILE"
        EXIT_CODE=$?

        SCORE=$(jq -r '.pulseScore.overall' "$JSON_FILE")
        GRADE=$(jq -r '.pulseScore.grade'   "$JSON_FILE")
        PASSED=$([ $EXIT_CODE -eq 0 ] && echo "true" || echo "false")

        echo "score=$SCORE"   >> "$GITHUB_OUTPUT"
        echo "grade=$GRADE"   >> "$GITHUB_OUTPUT"
        echo "passed=$PASSED" >> "$GITHUB_OUTPUT"

        rm -f "$JSON_FILE"

        # Propagate the CLI exit code so the step fails when score < threshold
        exit $EXIT_CODE
